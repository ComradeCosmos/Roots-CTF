name: "Civilization: The Firekeeper's Bone"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Dawn of Writing

  Long before computers, human civilization began around fire. Someone had to stay awake through the cold night to keep the fire burning. That was the first job anyone ever had. Soon after, people started writing things down — a mark on clay, a scratch on bone — so no one had to remember everything alone.

  You find an ancient bone carving from an early tribe. Instead of our modern 26-letter alphabet, it uses an alphabet of 37 symbols:
  `abcdefghijklmnopqrstuvwxyz0123456789_`

  Each character was shifted forward or backward based on its position number $i$:
  - For **even** positions $i$ (0, 2, 4...): shift forward by $(i + 7) \pmod{37}$
  - For **odd** positions $i$ (1, 3, 5...): shift backward by $(i \times 3 + 5) \pmod{37}$
  
  *(The brackets `{` and `}` are not shifted. Capital letters keep their capital form).*

  ```
  mdj3qryw{hk2axbxihix4f4347wbdcsff}
  ```

  Can you reverse the scratches and read the first message?

  ---
  **Attachment:** Download `cipher.txt` below.
value: 50
