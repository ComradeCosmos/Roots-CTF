description: >
  ### Mission Intelligence

  We intercepted an emergency beacon transmitted from Vance's comm-link across a quantum-fluctuating channel.
  
  The transmission officer noted that the beacon does not use standard 26-letter Caesar rotation. Instead, it utilizes an extended **Base-37 alphabet** (`abcdefghijklmnopqrstuvwxyz0123456789_`) with **alternating positional shifts**:
  - For **even** indices $i$: shift forward by $(i + 7) \pmod{37}$
  - For **odd** indices $i$: shift backward by $(i \times 3 + 5) \pmod{37}$
  
  *(Braces `{` and `}` are unshifted delimiters).*

  Standard AI prompt engines fail because they assume classical mod-26 rotation, but a human analyst with 5 lines of Python can decode this in seconds!

  ```
  mdj3{tgd7989ete90r0e0isn_oorb}
  ```

  ---
