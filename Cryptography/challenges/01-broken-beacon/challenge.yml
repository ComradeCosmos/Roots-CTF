hints:
  - content: "The alphabet has 37 symbols in total: letters a to z, numbers 0 to 9, and the underscore '_'. Braces '{' and '}' stay where they are."
    cost: 0
  - content: "To undo the shift at position i: if i is even, subtract (i + 7) mod 37. If i is odd, add (i * 3 + 5) mod 37."
    cost: 10
  - content: "In Python: new_idx = (idx - (i + 7)) % 37 if i % 2 == 0 else (idx + (i * 3 + 5)) % 37. Then look up the character in the alphabet."
    cost: 25

