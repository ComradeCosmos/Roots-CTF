name: "Civilization: The Diplomat's Oath"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: Envoys Across Borders

  As early empires grew, kings could no longer shout across valleys. Messengers rode day and night across continents carrying secret treaties. If a message was intercepted, war would follow.

  In the 16th century, diplomat Blaise de Vigenère created a cipher that baffled European cryptanalysts for centuries: the **Autokey cipher**. Instead of repeating a short codeword, the message itself becomes the continuing secret key!

  An intercepted royal dispatch carried to Paris was encrypted with the primer word **`PARIS`**:
  ```
  ulroxfwl{gztzves_wspiyww_fm_pkgmxizbs}
  ```

  Can you retrace the courier's steps and decode the diplomat's secret oath?

  ---
  **Attachment:** Download `cipher.txt` below.
value: 100
type: standard
state: visible

flags:
  - "flagfall{autokey_defeats_ai_prompting}"

tags: []

hints:
  - content: "The primer word is 'PARIS'. The first 5 encrypted letters use P-A-R-I-S as the key. Each decrypted letter then becomes the key for the subsequent letters!"
    cost: 0
  - content: "You cannot decrypt this in parallel. You must decrypt letter-by-letter sequentially because each plaintext character extends the keystream."
    cost: 10
  - content: "In Python: p_char = chr(((ord(c) - ord('a')) - (ord(k) - ord('a'))) % 26 + ord('a')), then keystream.append(p_char)."
    cost: 25

files:
  - "cipher.txt"
