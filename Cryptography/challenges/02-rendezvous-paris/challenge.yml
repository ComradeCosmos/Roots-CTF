hints:
  - content: "In an Autokey cipher, the key doesn't repeat. Instead, the plaintext characters are appended to the primer word to form the ongoing keystream."
    cost: 0
  - content: "Non-alphabetic characters (such as '{', '_', '}') are preserved and ignored in the key schedule. Decrypt letter by letter sequentially."
    cost: 10
  - content: "In Python: keep a list keystream = list('paris'). For each letter, p = (c - ord(keystream[k_idx]) + ord('a')) % 26, then keystream.append(chr(p + ord('a')))."
    cost: 25

