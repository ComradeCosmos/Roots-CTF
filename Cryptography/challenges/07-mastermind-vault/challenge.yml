hints:
  - content: "You know N = p * q and S = p + q. In algebra, (p - q)^2 = (p + q)^2 - 4*N."
    cost: 0
  - content: "Use Python's built-in math.isqrt(S * S - 4 * N) to compute the exact difference: diff = p - q. Then p = (S + diff) // 2 and q = S - p."
    cost: 10
  - content: "Once p and q are separated: phi = (p - 1)*(q - 1), d = pow(e, -1, phi), and m = pow(c, d, N). Convert m to ASCII."
    cost: 25

files:
