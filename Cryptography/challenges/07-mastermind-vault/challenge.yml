name: "Operation Cipherfall - Ep 07: The Mastermind's Vault"
author: "Agent Vance / Operation Cipherfall"
category: "Cryptography"
description: >
  ### Mission Intelligence

  We breached the underground datacenter housing the syndicate's mastermind server.
  The server key is protected by RSA-512 with modulus $N = p \times q$.
  
  During forensic extraction of the key generation script logs, we couldn't find the individual primes $p$ and $q$, but we found their combined sum:
  $$S = p + q$$
  
  Large language models fail to solve this directly because calculating 512-bit integer square roots without code execution results in arithmetic hallucination.
  
  However, for a human cryptanalyst with Python, this is simple high-school algebra:
  $$(p - q)^2 = (p + q)^2 - 4N$$
  
  Calculate the exact prime factors, find the private key $d$, and decrypt the mastermind's vault!

  ---
  **Attachments:** Download `rsa.txt` and `encrypt.py` below.
value: 200
type: standard
state: visible

