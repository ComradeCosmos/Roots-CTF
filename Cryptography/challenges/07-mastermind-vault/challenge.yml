category: "Cryptography"
description: >
  ### Historical Story: The Digital Gold Vault

  As civilization moved from gold coins to computers, banks needed a way to lock vaults using math instead of physical keys.

  A bank vault is locked with RSA encryption. The lock uses a large public number $N = p \times q$, where $p$ and $q$ are two secret prime numbers. It also uses the public exponent $e = 65537$. Normally, finding $p$ and $q$ from $N$ takes thousands of years.

  However, an engineer made a simple mistake: they wrote down the **sum** of the two secret primes in a maintenance note!
  
  $$S = p + q$$

  With simple school algebra, you can find the two primes without breaking a sweat:
  $$(p - q)^2 = (p + q)^2 - 4N = S^2 - 4N$$

  Using Python's `math.isqrt()`, you can find the difference $(p - q)$, uncover $p$ and $q$, and unlock the vault!

  ---
  **Attachments:** Download `rsa.txt` and `encrypt.py` below.
