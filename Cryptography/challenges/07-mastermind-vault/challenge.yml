hints:
  - content: "The bank thought the lock was unbreakable because N is huge. But knowing the sum S = p + q makes finding the secret primes easy with simple math: (p - q)^2 = S^2 - 4*N."
    cost: 0
  - content: "Find the difference between the primes: diff = math.isqrt(S * S - 4 * N). Then p = (S + diff) // 2 and q = S - p."
    cost: 10
  - content: "After finding p and q, compute phi = (p - 1) * (q - 1). Then find private key d = pow(e, -1, phi), and decrypt with m = pow(c, d, N). Finally, convert number m to text with bytes.fromhex(hex(m)[2:]).decode()."
    cost: 25

