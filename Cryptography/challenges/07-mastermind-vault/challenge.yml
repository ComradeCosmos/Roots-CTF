hints:
  - content: "You know N = p*q and S = p+q. Use the identity (p - q)^2 = S^2 - 4*N. In Python, math.isqrt(S*S - 4*N) computes the exact integer square root."
    cost: 0
  - content: "Let diff = math.isqrt(S*S - 4*N). Then p = (S + diff) // 2 and q = S - p."
    cost: 10
  - content: "Once you have p and q, compute phi = (p-1)*(q-1), private key d = pow(e, -1, phi), and flag = pow(c, d, N)."
    cost: 25

