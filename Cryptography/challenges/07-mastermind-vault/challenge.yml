name: "Civilization: The Digital Gold Vault"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Birth of Digital Commerce & Banking

  In the late 20th century, money turned into digital pulses. Central banks and stock exchanges built subterranean data centers secured by the mathematics of prime numbers: **RSA**.

  A digital gold bullion vault encrypts its transfer clearance codes with 512-bit RSA. But during a maintenance audit, a hardware leak exposed the exact sum of the two secret prime factors:
  $$S = p + q$$

  Given the modulus $N = p \cdot q$ and the sum $S = p + q$, high school algebra tells us:
  $$(p - q)^2 = (p + q)^2 - 4pq = S^2 - 4N$$

  Can you crack the vault and withdraw the gold?

  ---
  **Attachments:** Download `rsa.txt` and `encrypt.py` below.
