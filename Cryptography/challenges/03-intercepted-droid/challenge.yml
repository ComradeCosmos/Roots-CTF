hints:
  - content: "The alphabet has 37 symbols: letters a-z, numbers 0-9, and the underscore '_'. Braces '{' and '}' are not changed."
    cost: 0
  - content: "Because 37 is prime, every number a from 1 to 36 can be inverted with Python: a_inv = pow(a, -1, 37). Loop through all 1,332 combinations of a and b."
    cost: 10
  - content: "The secret keys are a = 11 and b = 23. Invert it using pow(11, -1, 37) = 27: calculate x = (27 * (y - 23)) % 37 for each character."
    cost: 25

