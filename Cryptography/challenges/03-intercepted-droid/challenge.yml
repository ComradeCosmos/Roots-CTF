hints:
  - content: "Since 37 is prime, every 'a' from 1 to 36 has a unique modular inverse. The total key space is only 36 * 37 = 1,332 possible keys."
    cost: 0
  - content: "To decrypt: D(y) = (a^(-1) * (y - b)) mod 37. In Python, compute the modular inverse with pow(a, -1, 37)."
    cost: 10
  - content: "A quick Python loop testing all 1,332 pairs will instantly find the readable flag starting with 'flagfall{'."
    cost: 25

