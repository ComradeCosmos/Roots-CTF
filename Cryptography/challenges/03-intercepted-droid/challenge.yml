name: "Civilization: The Granary Ledger"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The First Numbers and Trade

  Civilization flourished when humans learned mathematics to build granaries, divide harvests, and measure city walls. The Babylonians and Greeks turned arithmetic into art.

  You discover a preserved stone tax ledger from an ancient merchant guild. The scribes encrypted their balances using a modular transformation over their 37-character alphabet:
  `abcdefghijklmnopqrstuvwxyz0123456789_`

  Formula:
  $$E(x) = (a \cdot x + b) \pmod{37}$$

  Where:
  - $x$ is the symbol's index $(0 \le x < 37)$
  - $a$ and $b$ are secret keys $(1 \le a < 37,\ 0 \le b < 37)$

  ```
  e7xpex77{hntv7uzmuzyk0hjkyimy_m_vdjzynz}
  ```

  Can you compute the modular inverse and balance the ancient books?

  ---
  **Attachments:** Download `cipher.txt` and `affine.py` below.
