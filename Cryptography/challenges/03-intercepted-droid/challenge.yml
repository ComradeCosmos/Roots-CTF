description: >
  ### Mission Intelligence

  We recovered telemetry logs from a downed recon droid.
  The droid protected its message using an Affine Cipher, but with a twist that blinds standard AI decoders:
  It operates over a **prime modulus of 37**!
  
  $$\text{Alphabet: } \texttt{abcdefghijklmnopqrstuvwxyz0123456789\_} \quad (m = 37)$$
  $$E(x) = (a \cdot x + b) \pmod{37}$$

  Because 37 is a prime number, **every single non-zero integer** $a \in [1, 36]$ has a valid modular inverse!
  
  The total keyspace is only $36 \times 37 = 1,332$ combinations. An automated AI solver will hallucinate on mod-26 assumptions, but a simple 8-line Python brute-force script will solve it in milliseconds!

  ```
  e7xp{hntv7uzmuzyk0hjkyimy_m_vdjzynz}
  ```

  ---
  **Attachments:** Download `cipher.txt` and `affine.py` below.
