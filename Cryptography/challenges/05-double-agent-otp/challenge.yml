category: "Cryptography"
description: >
  ### Historical Story: The Undersea Cable

  In the late industrial age, long copper cables were laid across the bottom of the ocean to connect continents by telegraph. To send secret dispatches, military stations used a **One-Time Pad** — a stream of random key bytes.

  A One-Time Pad is mathematically impossible to break, but only if the key is used **once**. During an emergency, a nervous telegraph operator made a critical mistake: they reused the **exact same key tape** to encrypt two different messages!

  When a key is reused:
  $$C_1 \oplus C_2 = P_1 \oplus P_2$$

  Standard operational alerts on this telegraph line always begin with the known header prefix:
  `OPERATION CIPHERFALL: `

  ```
  Ciphertext 1 (Hex):
  1d3f2a26322f3d387e7f37783d7b1a227225132f0e4e1e297638675209237d1c361423603e133f2a30532d3d36100c3172397c0d5004507e

  Ciphertext 2 (Hex):
  112022393235305773103a7724611235705e7f2f7b2d144e7739643c7f237f1353642361341f2a3b31215b353e62133b722613183160217e
  ```

  Use XOR with the known starting words to reveal the key and uncover the secret messages!

  ---
  **Attachments:** Download `ciphertexts.txt` and `encrypt.py` below.
