name: "Civilization: The Transatlantic Cable"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Victorian Telegraph & Wire Taps

  In 1858, engineers laid copper cables across the Atlantic Ocean floor. For the first time in human history, news traveled faster than steamships. But with electric telegraphs came wiretaps.

  To guarantee secrecy, military telegraphers used the **One-Time Pad** — mathematically unbreakable, but only if the key is used once.

  A rogue telegrapher reused the same keystream to transmit two critical messages across the ocean cable:
  - **Message 1** is an operational report known to start with:
    `"OPERATION CIPHERFALL: "`
  - **Message 2** is a confidential order.

  Because $C_1 \oplus C_2 = P_1 \oplus P_2$, the shared key can be completely exposed!

  Can you tap the wire and recover the secret key?

  ---
  **Attachments:** Download `ciphertexts.txt` and `encrypt.py` below.
