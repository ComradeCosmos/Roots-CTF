name: "Operation Cipherfall - Ep 04: The XORd of Damocles"
author: "Agent Vance / Operation Cipherfall"
category: "Cryptography"
description: >
  ### Mission Intelligence

  We intercepted an encrypted directive issued to the syndicate's perimeter security sentries.
  Rather than using a static repeating key (which standard statistical tools or AI decoders can easily solve), the sentries use a **Linear Congruential Generator (LCG)** to produce a dynamic byte-stream:
  
  $$S_{i+1} = (137 \cdot S_i + 73) \pmod{256}$$
  $$C_i = P_i \oplus S_i$$

  The security team believed this pseudo-random stream was unbreakable. However, their engineer made a fatal flaw: the secret seed $S_0$ is only a **single 8-bit integer** ($0 \le S_0 \le 255$)!
  
  AI prompt models cannot track 256 state transitions in their head, but a human writing a quick 6-line loop can test all 256 seeds in a split second.

  ```
  Ciphertext (Hex): 4cafc56a451b9b668ddbbe1b8100531d4ee7c782e73417a5124b43365b1b1c55b7
  ```

  ---
  **Attachments:** Download `cipher.txt` and `xor.py` below.
