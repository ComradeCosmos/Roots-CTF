hints:
  - content: "The clockwork steps through numbers using S_{i+1} = (137 * S_i + 73) mod 256. The seed S_0 is a single number from 0 to 255."
    cost: 0
  - content: "You know the flag starts with 'Roots{'. Loop through all 256 possible seeds in Python and see which one decrypts to readable text."
    cost: 10
  - content: "The starting seed is 42. Start with state = 42, generate the numbers, and XOR each byte with the ciphertext bytes."
    cost: 25

