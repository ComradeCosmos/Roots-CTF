name: "Civilization: The Sentry's Clockwork"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Age of Mechanical Automata

  In medieval clock towers and Renaissance workshops, engineers built mechanical automatons — geared mechanisms that mimicked life and guarded fortress gates.

  A clockwork sentinel guards the archive gates. Its internal gear recurrence generates a stream of bytes using a Linear Congruential Generator:
  $$S_{i+1} = (137 \cdot S_i + 73) \pmod{256}$$

  Each secret byte of the royal decree was masked via XOR with the clockwork output:
  $$C_i = P_i \oplus S_i$$

  The initial bronze gear position $S_0$ is an 8-bit value $(0 \le S_0 \le 255)$.

  Intercepted transmission:
  ```
  4cafc56a5816946da9c7af12b92f52071dcc87a9ba337b8e4b084331061f2f4aa75728c1a3
  ```

  Can you rewind the clockwork and unlock the gate?

  ---
  **Attachments:** Download `cipher.txt` and `xor.py` below.
