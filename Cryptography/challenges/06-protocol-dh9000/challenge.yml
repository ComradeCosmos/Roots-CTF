description: >
  ### Mission Intelligence

  The syndicate's primary command satellite synchronizes session keys using a protocol designated `DH-9000`.
  
  Our ground station intercepted the public handshake parameters:
  ```
  p = 19997
  g = 5

  A = 2058
  B = 5125
  ```

  Once the shared secret $S = B^a \pmod p$ was computed, the satellite encrypted the directive using a key derived via SHA-256:
  `Key = SHA256(str(S))`
  `Encrypted Flag (Hex) = dcb3befd8907a8e142d9f6351d054d4c8f5810082a9600fba1259d9a115b57f1dea2`

  Because $p$ is small ($p = 19,997$), calculating the discrete logarithm is instantaneous with a Python loop. An AI cannot calculate SHA-256 hashes or discrete logarithms mentally, but your Python script will unlock this in 10 milliseconds!

  ---
  **Attachments:** Download `params.txt` and `dh.py` below.
