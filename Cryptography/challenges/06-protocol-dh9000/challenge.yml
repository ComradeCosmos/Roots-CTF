name: "Civilization: The Vanguard Satellite"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Space Race & Satellite Comms

  In the 1960s, humanity reached orbit. Satellites orbited the globe, creating the modern global communication grid. To negotiate cryptographic keys across open space, Whitfield Diffie and Martin Hellman introduced **Public Key Cryptography**.

  A vintage scientific satellite orbits above, exchanging telemetry with mission control over a prime field $GF(p)$:
  - Prime modulus $p = 19997$
  - Base generator $g = 5$
  - Ground Station Public Key $A = 2058$ ($g^a \pmod p$)
  - Satellite Public Key $B = 5125$ ($g^b \pmod p$)

  The satellite computed shared secret $S = B^a \pmod p$, derived an AES key via $\text{SHA-256}(\text{str}(S))$, and encrypted its mission payload:
  ```
  dcb3befd9402acd25d8ced090b074a1ca207545c2a9842e98a74b089551a6ba48aadbca9961e
  ```

  Can you compute the discrete logarithm and intercept the transmission?

  ---
  **Attachments:** Download `params.txt` and `dh.py` below.
