hints:
  - content: "Alice computed A = pow(5, a, 19997) == 2058. Loop through all numbers a from 1 to 19997 in Python until you find the match."
    cost: 0
  - content: "Once you have Alice's secret a, calculate shared secret S = pow(B, a, p). Turn S into bytes: key = hashlib.sha256(str(S).encode()).digest()."
    cost: 10
  - content: "Alice's secret is a = 13371, giving S = 18857. XOR the encrypted hex bytes with hashlib.sha256(b'18857').digest()."
    cost: 25

