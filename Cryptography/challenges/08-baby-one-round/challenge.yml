hints:
  - content: "A Substitution-Permutation Network (SPN) round consists of AddRoundKey, SubBytes, and Permutation. Decryption applies each inverse in reverse order."
    cost: 0
  - content: "Notice that swapping the high and low 4 bits (nibble swap) twice returns the original byte: swap_nibbles(swap_nibbles(b)) == b!"
    cost: 10
  - content: "Decryption steps: 1) XOR ciphertext with ROUND_KEY_1. 2) Apply swap_nibbles. 3) Map through INV_SBOX = {SBOX[i]: i for i in range(256)}. 4) XOR with ROUND_KEY_0."
    cost: 25

