name: "Civilization: The Connected World"
author: "FlagFall CTF"
category: "Cryptography"
description: >
  ### Historical Story: Modern Cyber Networks & Block Ciphers

  In the 21st century, billions of smartphones, fiber-optic backbones, and server farms connect human civilization into a single global consciousness. Modern security relies on Substitution-Permutation Networks (SPN) like AES.

  An advanced network firewall uses a lightweight custom SPN cipher with the standard AES S-Box and bitwise nibble permutations.

  The encryption executes **only 1 round**:
  1. $\text{State}_A = \text{Plaintext} \oplus \text{RoundKey}_0$
  2. $\text{State}_B = \text{SubBytes}(\text{State}_A)$ (AES S-Box)
  3. $\text{State}_C = \text{NibbleSwap}(\text{State}_B)$
  4. $\text{Ciphertext} = \text{State}_C \oplus \text{RoundKey}_1$

  Intercepted encrypted transmission:
  ```
  0d1c145bd240431e7e104690697ba290cc1cb7ca11114eaee3a363ee7a4ad4315d1c04cebf
  ```

  Can you trace the single round backward to reach the core?

  ---
  **Attachments:** Download `cipher.txt` and `chall.py` below.
