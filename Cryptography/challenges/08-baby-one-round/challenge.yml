name: "Civilization: The Connected World"
author: "Civilization CTF"
category: "Cryptography"
description: >
  ### Historical Story: The Global Internet

  Today, everything in human civilization is connected. Phones, computers, and servers all talk across thousands of miles of glass fiber cables.

  To send data quickly, network engineers built an encryption program that scrambles messages in four steps:
  1. Add round key 0 (using XOR)
  2. Replace each byte using a lookup table (S-Box)
  3. Swap the first 4 bits and last 4 bits of each byte (nibble swap)
  4. Add round key 1 (using XOR)

  Real modern ciphers (like AES) repeat these steps 10 or more times to keep data safe. But to make this network run faster, the engineers only ran the steps **one single time**!

  Because it only ran once, you can undo each step one by one in reverse order to read the secret message.

  ```
  Ciphertext (Hex):
  62dbb47b113127aea76c43ce3d8ec1ad5dfd3ec1f09d944cc17ff934150bc10f63a8
  ```

  ---
  **Attachments:** Download `cipher.txt` and `chall.py` below.
value: 250
type: standard
state: visible

