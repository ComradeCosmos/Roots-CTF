hints:
  - content: "A single SPN round provides zero long-term security. Every operation (XOR, S-Box, Nibble Swap) is 100% invertible in reverse order."
    cost: 0
  - content: "Swapping nibbles twice returns the original byte: swap_nibbles(swap_nibbles(b)) == b."
    cost: 10
  - content: "Step 1: XOR ciphertext with RoundKey1. Step 2: Swap nibbles. Step 3: Invert AES S-Box using an inverse lookup table. Step 4: XOR with RoundKey0."
    cost: 25

