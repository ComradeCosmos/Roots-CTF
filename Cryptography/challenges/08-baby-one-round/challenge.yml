hints:
  - content: "Because the cipher only ran for 1 round, you can decrypt the message by running the 4 steps backwards."
    cost: 0
  - content: "Swapping the first and last 4 bits of a byte twice puts it right back to normal. So swapping is its own reverse!"
    cost: 10
  - content: "Decryption steps: 1) XOR ciphertext with ROUND_KEY_1. 2) Swap nibbles on each byte. 3) Reverse the S-Box lookup: INV_SBOX = {SBOX[i]: i for i in range(256)}. 4) XOR with ROUND_KEY_0."
    cost: 25

files:
  - cipher.txt
  - chall.py
