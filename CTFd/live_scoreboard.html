<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live CTF Arena Scoreboard</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --accent: #00e5ff;
            --text: #f0f6fc;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 24px 0;
            background: linear-gradient(180deg, #131b2e 0%, #090d16 100%);
            border-bottom: 2px solid rgba(0, 229, 255, 0.2);
        }
        h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }
        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        th {
            text-align: left;
            padding: 18px 24px;
            font-size: 1.2rem;
            color: #8b949e;
            background: #19243d;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        td {
            padding: 20px 24px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }
        .rank-1 { color: var(--gold); font-weight: bold; background: rgba(255, 215, 0, 0.08); }
        .rank-2 { color: var(--silver); font-weight: bold; background: rgba(192, 192, 192, 0.05); }
        .rank-3 { color: var(--bronze); font-weight: bold; background: rgba(205, 127, 50, 0.05); }
        .score {
            text-align: right;
            color: #39d353;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.7rem;
        }
        #alert-banner {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.5);
            z-index: 100;
            animation: bounceIn 0.5s ease;
        }
    </style>
</head>
<body>
    <header>
        <h1>⚡ LIVE CTF LEADERBOARD ⚡</h1>
    </header>

    <div id="alert-banner">🎯 First Blood Alert!</div>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th style="width: 120px;">Rank</th>
                    <th>Team Name</th>
                    <th style="text-align: right; width: 220px;">Score</th>
                </tr>
            </thead>
            <tbody id="scoreboard-rows">
                <tr><td colspan="3" style="text-align: center;">Connecting to live stream...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const CTFD_HOST = window.location.origin.includes("http") ? window.location.origin : "http://127.0.0.1:8000";

        async function updateScoreboard() {
            try {
                const res = await fetch(`${CTFD_HOST}/api/v1/scoreboard`);
                const json = await res.json();
                if (json.success && json.data) {
                    renderRows(json.data.slice(0, 10)); // Top 10
                }
            } catch (err) {
                console.error("Scoreboard fetch error:", err);
            }
        }

        function renderRows(teams) {
            const tbody = document.getElementById("scoreboard-rows");
            if (!teams || teams.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #8b949e;">No solves recorded yet</td></tr>';
                return;
            }
            tbody.innerHTML = teams.map((team, index) => {
                const rankClass = index === 0 ? "rank-1" : index === 1 ? "rank-2" : index === 2 ? "rank-3" : "";
                const medal = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "";
                return `
                    <tr class="${rankClass}">
                        <td>#${team.pos}</td>
                        <td>${medal}${team.name}</td>
                        <td class="score">${team.score} pts</td>
                    </tr>
                `;
            }).join("");
        }

        // Initial fetch + periodic backup
        updateScoreboard();
        setInterval(updateScoreboard, 10000);

        // Real-Time Server Sent Events
        try {
            const events = new EventSource(`${CTFD_HOST}/events`);
            events.addEventListener("scoreboard", () => updateScoreboard());
            events.addEventListener("submission", (e) => {
                const data = JSON.parse(e.data);
                triggerAlert(`🔥 ${data.account_name || "A team"} solved a challenge!`);
                updateScoreboard();
            });
        } catch(e) {
            console.warn("SSE connection error:", e);
        }

        function triggerAlert(msg) {
            const banner = document.getElementById("alert-banner");
            banner.innerText = msg;
            banner.style.display = "block";
            setTimeout(() => { banner.style.display = "none"; }, 5000);
        }
    </script>
</body>
</html>
