<script>
// Force dark theme and calibrate ECharts
try {
  localStorage.setItem('theme', 'dark');
  document.documentElement.setAttribute('data-bs-theme', 'dark');
} catch (e) {}

// Calibrate ECharts:
// 1. Grid top: 95 ensures score lines and data points never collide with the zoom slider
// 2. Toolbox restore: provides dedicated "Reset Zoom" feature to reset both box zoom and slider zoom
// 3. Styled dataZoom slider with emerald theme palette
window.scoreboardChartOptions = {
  grid: {
    top: 95,
    bottom: 60,
    containLabel: true
  },
  toolbox: {
    iconStyle: {
      borderColor: "#8E96A4"
    },
    feature: {
      restore: {
        title: "Reset Zoom"
      }
    }
  },
  dataZoom: [
    {
      top: 38,
      height: 22,
      fillerColor: "rgba(63, 198, 124, 0.25)",
      borderColor: "rgba(255, 255, 255, 0.15)"
    }
  ]
};
</script>
